services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dbanalysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbanalysis"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
